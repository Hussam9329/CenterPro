name: CenterPro quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build server-backed frontend for transport tests
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/centerpro_transport_only
          SESSION_SECRET: transport-tests-only-not-a-production-secret
      - run: npm run test:e2e:remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
            remote-test-results/
            playwright-remote-report/
          retention-days: 14
